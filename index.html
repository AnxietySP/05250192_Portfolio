<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sonam Phuntsho — Portfolio</title>

    <meta name="description" content="The personal portfolio of Sonam Phuntsho, a Computer System and Network student interested in networking, system administration, and web development." />
    <meta name="author" content="Sonam Phuntsho" />
    <meta name="theme-color" content="#1b2416" />

    <!-- Load saved theme before rendering -->
    <script>
        (function () {
            try {
                if (localStorage.getItem("theme") === "dark") {
                    document.documentElement.classList.add("dark-mode");
                }
            } catch (error) {}
        })();
    </script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        rel="stylesheet"
    />

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="style.css" />
</head>

<body data-page="home">

    <!-- Apply theme to body before visible content -->
    <script>
        if (document.documentElement.classList.contains("dark-mode")) {
            document.body.classList.add("dark-mode");
        }
    </script>

    <!-- Accessibility: Skip Navigation -->
    <a href="#main-content" class="skip-link">
        Skip to content
    </a>

    <!-- Custom Cursor -->
    <div class="cursor" aria-hidden="true"></div>
    <div class="cursor-ring" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <!-- =================================
         FIXED TOP HEADER
    ================================== -->

    <header class="nav">

        <a href="index.html" class="brand" aria-label="Sonam Phuntsho home">
            SP<span>.</span>
        </a>

        <button
            id="theme-toggle"
            class="theme-toggle"
            type="button"
            aria-label="Toggle dark mode"
            title="Toggle dark mode"
        >
            <i class="fas fa-moon" aria-hidden="true"></i>
        </button>

    </header>

    <!-- =================================
         COPPER ICON NAVIGATION
    ================================== -->

    <nav class="sidebar-nav" aria-label="Main navigation">

        <a
            href="index.html"
            class="nav-icon active"
            aria-label="Home"
            aria-current="page"
            data-label="Home"
        >
            <i class="fas fa-house" aria-hidden="true"></i>
        </a>

        <a
            href="about.html"
            class="nav-icon"
            aria-label="About"
            data-label="About"
        >
            <i class="far fa-user" aria-hidden="true"></i>
        </a>

        <a
            href="skills.html"
            class="nav-icon"
            aria-label="Skills"
            data-label="Skills"
        >
            <i class="fas fa-network-wired" aria-hidden="true"></i>
        </a>

        <a
            href="certificates.html"
            class="nav-icon"
            aria-label="Certificates"
            data-label="Certificates"
        >
            <i class="fas fa-award" aria-hidden="true"></i>
        </a>

        <a
            href="projects.html"
            class="nav-icon"
            aria-label="Projects"
            data-label="Projects"
        >
            <i class="far fa-folder-open" aria-hidden="true"></i>
        </a>

        <a
            href="contact.html"
            class="nav-icon"
            aria-label="Contact"
            data-label="Contact"
        >
            <i class="far fa-envelope" aria-hidden="true"></i>
        </a>

    </nav>

    <!-- =================================
         MAIN HERO SECTION
    ================================== -->

    <main class="page hero" id="main-content">

        <div class="hero-content">

            <p class="eyebrow">
                — Portfolio · Bhutan 🇧🇹
            </p>

            <h1 class="display">
                Sonam<br />
                <em>Phuntsho</em>
            </h1>

            <p class="lede">
                Diploma student in
                <strong>Computer System &amp; Network</strong>.

                Building secure systems, crafting clean interfaces,
                and chasing flags in the dark.
            </p>

            <!-- Hero Buttons -->
            <div class="hero-actions">

                <a href="projects.html" class="btn btn-copper">
                    View Projects
                    <i class="fas fa-arrow-right" aria-hidden="true"></i>
                </a>

                <a href="about.html" class="btn btn-ghost">
                    About Me
                </a>

            </div>

            <!-- Social Links -->
            <ul class="socials">

                <li>
                    <a
                        href="https://github.com/AnxietySP"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Visit my GitHub profile"
                    >
                        <i class="fab fa-github" aria-hidden="true"></i>
                        GitHub
                    </a>
                </li>

                <li>
                    <a
                        href="https://www.linkedin.com/in/sonam-phuntsho-440aa4437/"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Visit my LinkedIn profile"
                    >
                        <i class="fab fa-linkedin" aria-hidden="true"></i>
                        LinkedIn
                    </a>
                </li>

            </ul>

        </div>

        <!-- =================================
             HERO VISUAL — SOLAR SYSTEM
        ================================== -->

        <div class="hero-visual">

            <div class="solar-system">

                <!-- Profile Image -->
                <div class="center-profile">
                    <img
                        src="pictures/profile.jpeg"
                        alt="Portrait of Sonam Phuntsho"
                    />
                </div>

                <!-- Networking -->
                <div class="orbit orbit-1">
                    <div class="planet">
                        <i class="fas fa-network-wired" aria-hidden="true"></i>
                        <span class="tooltip tooltip-top">
                            Networking
                        </span>
                    </div>
                </div>

                <!-- Linux -->
                <div class="orbit orbit-2">
                    <div class="planet">
                        <i class="fab fa-linux" aria-hidden="true"></i>
                        <span class="tooltip tooltip-right">
                            Linux Admin
                        </span>
                    </div>
                </div>

                <!-- Windows Server -->
                <div class="orbit orbit-3">
                    <div class="planet">
                        <i class="fab fa-windows" aria-hidden="true"></i>
                        <span class="tooltip tooltip-bottom">
                            Windows Server
                        </span>
                    </div>
                </div>

                <!-- DevOps -->
                <div class="orbit orbit-4">
                    <div class="planet">
                        <i class="fas fa-infinity" aria-hidden="true"></i>
                        <span class="tooltip tooltip-left">
                            DevOps
                        </span>
                    </div>
                </div>

                <!-- Web Development -->
                <div class="orbit orbit-5">
                    <div class="planet">
                        <i class="fas fa-palette" aria-hidden="true"></i>
                        <span class="tooltip tooltip-top">
                            Web &amp; UI/UX
                        </span>
                    </div>
                </div>

            </div>

        </div>

    </main>

    <!-- Robot Assistant is automatically added by script.js -->

    <script src="script.js"></script>

</body>
</html>
